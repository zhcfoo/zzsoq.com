# zzsoq.com —— 纯静态站点的 nginx 配置（1G 内存 VPS 足够）
# 用法：把网站文件放到 /var/www/zzsoq.com，然后
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/zzsoq.com.conf && sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo certbot --nginx -d zzsoq.com -d www.zzsoq.com

server {
    listen 80;
    listen [::]:80;
    server_name zzsoq.com www.zzsoq.com;

    root /var/www/zzsoq.com;
    index index.html;

    # 文本资源压缩（字体、图片、音乐本身已压缩，不再压）
    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml;

    # 字体、库、音乐、照片：长缓存（改了文件名才会变）；页面本身不缓存，改完立刻生效
    location ~* \.(woff2|mp3|m4a|jpg|jpeg|png|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.(js|css)$ {
        expires 1h;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 不对外暴露仓库里的说明和工具
    location ~ /(\.git|tools|deploy)/ { deny all; }
    location ~ \.md$ { deny all; }
}
