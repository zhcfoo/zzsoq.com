name: Deploy zzsoq.com to VPS

on:
  push:
    branches:
      - claude/birthday-tribute-scroll-site-p0jch7
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zzsoq-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        id: check
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "::notice::Deployment secrets are not configured; skipping deployment."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync deployed branch on VPS
        if: steps.check.outputs.ready == 'yes'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          port="${VPS_PORT:-22}"
          install -m 700 -d "$HOME/.ssh"
          eval "$(ssh-agent -s)"
          printf '%s\n' "$VPS_SSH_KEY" | ssh-add -
          printf '%s\n' "192.236.235.13 ssh-rsa " >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -p "$port" -o BatchMode=yes -o ConnectTimeout=20 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" "git -C /var/www/zzsoq.com fetch --no-tags origin claude/birthday-tribute-scroll-site-p0jch7 && git -C /var/www/zzsoq.com reset --hard FETCH_HEAD"
