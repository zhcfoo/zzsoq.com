# 推送到 GitHub 后自动部署到自己的 VPS（nginx + Let's Encrypt HTTPS）
# 需要在仓库 Settings → Secrets and variables → Actions 里添加：
#   VPS_HOST      服务器 IP
#   VPS_USER      登录用户名（一般是 root）
#   VPS_PASSWORD  登录密码            （或者用 VPS_SSH_KEY 填私钥，二选一）
#   CERT_EMAIL    申请 HTTPS 证书用的邮箱
#   VPS_PORT      可选，SSH 端口，默认 22
name: Deploy to VPS

on:
  push:
    branches: [main, claude/birthday-tribute-scroll-site-p0jch7]
  workflow_dispatch:

concurrency: deploy-vps

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_HOST }}
      USER_: ${{ secrets.VPS_USER }}
      PASSWORD: ${{ secrets.VPS_PASSWORD }}
      SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      PORT: ${{ secrets.VPS_PORT }}
      EMAIL: ${{ secrets.CERT_EMAIL }}
      DOMAIN: zzsoq.com
      WEBROOT: /var/www/zzsoq.com
    steps:
      - uses: actions/checkout@v4

      - name: 检查服务器信息是否已填写
        id: check
        run: |
          if [ -z "$HOST" ] || [ -z "$USER_" ] || { [ -z "$PASSWORD" ] && [ -z "$SSH_KEY" ]; }; then
            echo "::warning::还没有在仓库 Secrets 里填写 VPS_HOST / VPS_USER / VPS_PASSWORD，本次跳过部署"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 准备 SSH 连接
        if: steps.check.outputs.ready == 'yes'
        run: |
          sudo apt-get install -y sshpass rsync >/dev/null
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          P="${PORT:-22}"
          if [ -n "$SSH_KEY" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
            echo "SSH=ssh -p $P -i $HOME/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20" >> "$GITHUB_ENV"
          else
            echo "SSH=sshpass -e ssh -p $P -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ConnectTimeout=20" >> "$GITHUB_ENV"
          fi
          echo "SSHPASS=$PASSWORD" >> "$GITHUB_ENV"

      - name: 服务器初始化（安装 nginx、证书工具，放行端口）
        if: steps.check.outputs.ready == 'yes'
        run: |
          $SSH "$USER_@$HOST" 'bash -s' <<'REMOTE'
          set -e
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo"
          if command -v apt-get >/dev/null; then
            export DEBIAN_FRONTEND=noninteractive
            command -v nginx >/dev/null && command -v certbot >/dev/null && command -v rsync >/dev/null || {
              $SUDO apt-get update -y && $SUDO apt-get install -y nginx rsync certbot python3-certbot-nginx; }
          else
            PM=$(command -v dnf || command -v yum)
            command -v nginx >/dev/null && command -v certbot >/dev/null && command -v rsync >/dev/null || {
              $SUDO $PM install -y epel-release || true; $SUDO $PM install -y nginx rsync certbot python3-certbot-nginx; }
          fi
          $SUDO systemctl enable --now nginx
          if command -v ufw >/dev/null && $SUDO ufw status | grep -q active; then $SUDO ufw allow 80/tcp; $SUDO ufw allow 443/tcp; fi
          if command -v firewall-cmd >/dev/null && $SUDO firewall-cmd --state >/dev/null 2>&1; then
            $SUDO firewall-cmd --permanent --add-service=http --add-service=https && $SUDO firewall-cmd --reload; fi
          $SUDO mkdir -p /var/www/zzsoq.com/music /var/www/zzsoq.com/photos
          $SUDO chown -R "$(id -un)" /var/www/zzsoq.com
          echo "系统：$(. /etc/os-release && echo $PRETTY_NAME)；内存：$(free -m | awk '/Mem/{print $2}') MB"
          REMOTE

      - name: 上传网站文件
        if: steps.check.outputs.ready == 'yes'
        run: |
          # music/、photos/ 里服务器上已有的文件保留（歌曲和照片可以直接传到服务器）
          rsync -az --delete -e "$SSH" \
            --exclude '.git' --exclude '.github' --exclude 'src' --exclude 'music/***' --exclude 'photos/***' \
            ./ "$USER_@$HOST:$WEBROOT/"
          rsync -az -e "$SSH" music/ "$USER_@$HOST:$WEBROOT/music/"
          rsync -az -e "$SSH" photos/ "$USER_@$HOST:$WEBROOT/photos/"

      - name: 启用 nginx 配置并申请 HTTPS
        if: steps.check.outputs.ready == 'yes'
        run: |
          $SSH "$USER_@$HOST" "EMAIL='$EMAIL' bash -s" <<'REMOTE'
          set -e
          SUDO=""; [ "$(id -u)" = 0 ] || SUDO="sudo"
          $SUDO chmod -R a+rX /var/www/zzsoq.com
          command -v restorecon >/dev/null && $SUDO restorecon -R /var/www/zzsoq.com || true
          $SUDO mkdir -p /etc/nginx/conf.d
          $SUDO cp /var/www/zzsoq.com/deploy/nginx.conf /etc/nginx/conf.d/zzsoq.com.conf
          $SUDO rm -f /etc/nginx/sites-enabled/default
          if [ -f /etc/letsencrypt/live/zzsoq.com/fullchain.pem ]; then
            # 证书已存在：让 certbot 把 HTTPS 配置重新装进刚更新的 nginx 配置
            $SUDO certbot --nginx -n --reinstall --redirect -d zzsoq.com -d www.zzsoq.com --cert-name zzsoq.com || true
          fi
          $SUDO nginx -t && $SUDO systemctl reload nginx
          if [ ! -f /etc/letsencrypt/live/zzsoq.com/fullchain.pem ]; then
            if [ -n "$EMAIL" ]; then
              $SUDO certbot --nginx -n --agree-tos -m "$EMAIL" --redirect -d zzsoq.com -d www.zzsoq.com \
                || echo "::warning::HTTPS 证书申请失败：检查域名解析、安全组 80 端口、大陆服务器是否已备案"
            else
              echo "::warning::没有填写 CERT_EMAIL，暂不申请 HTTPS 证书"
            fi
          fi
          echo "部署完成"
          REMOTE

      - name: 检查网站能否打开
        if: steps.check.outputs.ready == 'yes'
        run: |
          for u in "http://$DOMAIN" "https://$DOMAIN"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || true)
            echo "$u → $code"
          done
          curl -s --max-time 20 "https://$DOMAIN" | grep -q "<title>" && echo "✅ https://$DOMAIN 已上线" || \
            (curl -s --max-time 20 "http://$DOMAIN" | grep -q "<title>" && echo "✅ http://$DOMAIN 已上线（HTTPS 未就绪）" || echo "::warning::网站还打不开，看上面的步骤日志")
